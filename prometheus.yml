global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "fastapi"

    metrics_path: /metrics

    static_configs:
      - targets:
          - app1:8000
          - app2:8000
          - app3:8000

  - job_name: "redis"

    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: "nginx"

    static_configs:
      - targets:
          - nginx-exporter:9113